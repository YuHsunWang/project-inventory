<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!--__MATHJAX__-->
<style>
:root{
  --ground:#EDF0EA; --paper:#FAFBF7; --ink:#17201B; --muted:#56625A; --faint:#8B968F; --line:#C9D1C9; --grid:#DDE3DB;
  --accent:#0E5B60; --accent-soft:#D5E8E6;
  --done:#2E7A4C; --done-soft:#DCEFE2; --wait:#2A5FC4; --wait-soft:#DCE6F8;
  --open:#A86A12; --open-soft:#F6E9CF; --dead:#8A938D; --dead-soft:#E6E9E5; --bad:#B23A22; --bad-soft:#F7DCD5;
  --viz-done:#1F6B40; --viz-open:#B8761A;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:var(--sans);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 4px 14px rgba(20,30,25,.06); --radius:14px;
}
/* a project's color (--pc0, set inline) as used on the page; dark mode lightens it so it reads on dark paper */
.pc{--pc:var(--pc0)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111513; --paper:#181D1A; --ink:#E4EAE5; --muted:#A1ACA5; --faint:#6F7A73; --line:#2F3833; --grid:#222A25;
    --accent:#6CC4C6; --accent-soft:#1B3334;
    --done:#6FC08F; --done-soft:#19301F; --wait:#7FA6F0; --wait-soft:#1B2640;
    --open:#E0A94E; --open-soft:#33280F; --dead:#7D8680; --dead-soft:#232826; --bad:#F08A70; --bad-soft:#3A1E18;
    --viz-done:#56A876; --viz-open:#B8801F; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  }
  :root:not([data-theme="light"]) .pc{--pc:color-mix(in srgb,var(--pc0) 62%,#fff)}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111513; --paper:#181D1A; --ink:#E4EAE5; --muted:#A1ACA5; --faint:#6F7A73; --line:#2F3833; --grid:#222A25;
  --accent:#6CC4C6; --accent-soft:#1B3334;
  --done:#6FC08F; --done-soft:#19301F; --wait:#7FA6F0; --wait-soft:#1B2640;
  --open:#E0A94E; --open-soft:#33280F; --dead:#7D8680; --dead-soft:#232826; --bad:#F08A70; --bad-soft:#3A1E18;
  --viz-done:#56A876; --viz-open:#B8801F; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}
:root[data-theme="dark"] .pc{--pc:color-mix(in srgb,var(--pc0) 62%,#fff)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em}

/* top bar + project menu */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 72%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:nowrap}
.brand{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.stamp{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.menubtn{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:var(--shadow)}
.menubtn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.menu{margin:10px -16px -10px;padding:6px 16px 14px;border-top:1px solid var(--line);max-height:calc(100dvh - 70px);overflow-y:auto}
.menu[hidden]{display:none}
.menu .wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px}
@media (max-width:560px){.menu .wrap{grid-template-columns:1fr 1fr}}
.menu a{display:grid;grid-template-columns:10px 1fr;gap:2px 8px;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.35}
.menu a:hover,.menu a[aria-current="page"]{background:var(--paper)}
.menu a[aria-current="page"]{font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
.menu a i{width:10px;height:10px;border-radius:50%}
.menu a small{grid-column:2;color:var(--open);font-size:12px;font-weight:700}
.menu a.home i{background:var(--ink)}

/* home */
h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.hero{padding-block:36px 22px}
.hero .eyebrow{margin:0 0 6px;font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.hero h1{font-size:clamp(28px,4vw,40px);margin:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:20px}
.sumt{display:grid;gap:2px;padding:12px 14px;border-radius:var(--radius);background:color-mix(in srgb,var(--c) 11%,var(--paper));box-shadow:var(--shadow)}
.sumt b{font-family:var(--display);font-size:30px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.sumt span{font-size:13.5px;color:var(--muted);letter-spacing:.01em}
h2.sec{font-family:var(--display);font-size:24px;margin:44px 0 12px;font-weight:700;letter-spacing:-.01em}
.todos{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 14px;margin-top:8px}
.todo{display:grid;grid-template-columns:44px 1fr auto 18px;gap:2px 12px;align-items:baseline;padding:6px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.todos .todo:last-child{border-bottom:0}
.todo:hover{background:color-mix(in srgb,var(--pc,var(--accent)) 5%,var(--paper))}
.todo .tn{font-family:var(--display);font-size:19px;line-height:1;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.todo .tt{font-size:14.5px}
.todo .tp{font-size:13px;color:var(--muted);white-space:nowrap}
.todo .ta{color:var(--faint);font-size:17px;line-height:1}
.todos.small{margin:18px 0 0;padding:0 12px}
.todos.small .todo{grid-template-columns:36px 1fr 18px;padding:5px 4px}
.todos.small .tn{font-size:16px}
.todos.small .tp{display:none}
@media (max-width:560px){.todo{grid-template-columns:36px 1fr 14px}.todo .tn{font-size:17px}.todo .tp{grid-column:2;grid-row:2;white-space:normal}.todo .ta{grid-row:1/3;grid-column:3}}
.drawers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.drawer{display:grid;gap:4px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;text-decoration:none}
.drawer:hover{background:color-mix(in srgb,var(--pc) 5%,var(--paper))}
.drawer .dn{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.015em}
.drawer .dn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:10px;vertical-align:.12em}
.drawer .dt2{color:var(--muted);font-size:14px}
.drawer .dnow{font-size:13.5px}
.drawer .dfoot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em}
.drawer .dtodo{color:var(--open);font-weight:700}
.spark{width:96px;height:22px}
.spark rect{fill:var(--pc)}
@media (prefers-reduced-motion:no-preference){.todo,.drawer{transition:background-color .15s}}

/* project page */
.back{display:inline-block;margin-top:24px;font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.phead{padding:8px 0 0 16px;border-left:5px solid var(--pc);margin-top:10px}
.phead h2{font-family:var(--display);font-size:clamp(32px,5vw,48px);margin:0;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.phead .tag{margin:6px 0 0;font-size:15.5px;max-width:60ch;color:var(--muted)}
.phead .now{margin:8px 0 0;font-size:14px}
.phead .links{margin:8px 0 0;display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.phead .links a{color:var(--accent)}
.subnav{display:inline-flex;max-width:100%;gap:2px;padding:3px;margin:26px 0 18px;border-radius:11px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted)}
.subnav a small{font-size:12px;margin-left:6px;color:var(--faint)}
.subnav a[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--paper);box-shadow:var(--shadow)}
h3{font-family:var(--display);font-size:22px;margin:30px 0 4px;font-weight:700;letter-spacing:-.01em}
.panel h3:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.st{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.st.ok{background:var(--done-soft);color:var(--done)} .st.warn{background:var(--open-soft);color:var(--open)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.hist{background:var(--dead-soft);color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);margin:6px 0 0}

/* road: spine down the middle, branches left/right, curves drawn by JS */
.road{position:relative;padding-block:10px 20px}
.road>svg.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.road .spine{fill:none;stroke:var(--pc);stroke-opacity:.6;stroke-width:3;stroke-linecap:round}
.road .spine.tail{stroke-dasharray:2 7}
.road .twig{fill:none;stroke:color-mix(in srgb,var(--pc) 55%,var(--line));stroke-width:2;stroke-dasharray:5 4}
.zone-mark{position:relative;display:flex;justify-content:center;margin:26px 0 10px}
.zone-mark span{background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:700;letter-spacing:.06em;padding:4px 14px;border-radius:999px;text-align:center}
.step{position:relative;display:grid;grid-template-columns:1fr minmax(260px,330px) 1fr;gap:12px 48px;align-items:center;margin-block:18px}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;grid-column:2;grid-row:1}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.side.l{align-items:flex-end;grid-column:1;grid-row:1}
.side.r{align-items:flex-start;grid-column:3;grid-row:1}
.leaf{display:flex;align-items:baseline;gap:7px;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 9px 3px 5px;font-size:13px;line-height:1.35;text-decoration:none;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--sans)}
.leaf:hover{border-color:var(--ink)}
.leaf .id{flex:none}
.node{position:relative;z-index:1;display:grid;grid-template-columns:40px 1fr;gap:2px 12px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--pc) 16%,var(--paper));border:2px solid var(--ink);border-radius:10px;padding:12px 14px 10px;color:var(--ink);font:inherit;box-shadow:0 3px 0 var(--ink)}
.node:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.node[aria-expanded="true"]{background:color-mix(in srgb,var(--pc) 28%,var(--paper))}
.node .ic{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;border:1.5px solid var(--pc)}
.node .ic svg{width:28px;height:28px}
.node .t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.node .s{font-size:13px;color:var(--muted);line-height:1.45}
.node .n{position:absolute;top:-10px;left:-10px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 11px var(--mono);display:grid;place-items:center}
.node .more{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.node .more span{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.node .more span.x{margin-left:auto;border:0;background:none;color:var(--ink)}
.node .more span.c{border:0}
.node .more span.c.done{background:var(--done-soft);color:var(--done)}
.node .more span.c.wait{background:var(--wait-soft);color:var(--wait)}
.node .more span.c.open{background:var(--open-soft);color:var(--open)}
.node.br{width:min(100%,250px);grid-template-columns:32px 1fr;gap:1px 10px;padding:9px 12px 8px;background:var(--paper);border-width:1.5px;box-shadow:0 2px 0 var(--ink)}
.node.br .ic{width:32px;height:32px}
.node.br .ic svg{width:22px;height:22px}
.node.br .t{font-size:16.5px}
.node.br .s{font-size:12.5px}
.mid>.node{width:100%}
@media (prefers-reduced-motion:reduce){.node:hover{transform:none}}
.detail{grid-column:1/-1;grid-row:2;min-width:0;background:color-mix(in srgb,var(--accent) 7%,var(--paper));border:1px solid var(--ink);border-radius:12px;padding:16px 18px;position:relative;z-index:1}
/* panels float over free space beside their node (JS places them), so opening one never moves the flow */
.detail.at-r,.detail.at-l,.detail.in-l,.detail.in-r{position:absolute;grid-area:auto;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.detail.flow{position:relative;grid-row:2;left:auto!important;top:auto!important;width:auto!important;box-shadow:none}
.detail.flow.at-r,.detail.flow.in-r{grid-column:3} .detail.flow.at-l,.detail.flow.in-l{grid-column:1}
.detail .dn{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 11px var(--mono);vertical-align:1px}
.detail h5{margin:0 0 10px;font-size:15px;font-family:var(--display)}
.detail .dtext{margin:0 0 10px;font-size:14px;white-space:pre-line}
.mathbox mjx-container svg{max-width:100%;height:auto}
.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.media:empty{display:none}
.media figure{margin:0;display:flex;flex-direction:column;gap:6px}
.media figure:has(img:not(.phone)){grid-column:1/-1}
.media img{display:block;width:auto;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.media img.phone{max-width:min(100%,300px)}
.media figcaption{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tagx{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.tagx.shot{background:var(--wait-soft);color:var(--wait)}
.tagx.math{background:var(--accent-soft);color:var(--accent)}
.tagx.mock{background:var(--open-soft);color:var(--open)}
.tagx.real{background:var(--done-soft);color:var(--done)}
.tagx.bad{background:var(--bad-soft);color:var(--bad)}
.mathbox{background:var(--ground);border-radius:8px;padding:12px 14px;overflow-x:auto}
.mathbox .eq{margin:6px 0;overflow-x:auto}
.mathbox p{margin:6px 0 0;font-size:13.5px}
.mathbox mjx-container{color:var(--ink)}
pre.mock{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--ground);border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;margin:0}
pre.mock.cols{white-space:pre}
pre.mock b{color:var(--accent)}
pre.mock .dim{color:var(--faint)}
pre.mock .bad{color:var(--bad);font-weight:600}
.tks{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-top:12px}
.tks b{font-size:12.5px;color:var(--muted);margin-right:4px}
.where{margin-top:12px;font-size:13px;color:var(--muted)}
.where code{overflow-wrap:anywhere;font-size:12.5px;background:var(--ground);padding:1px 5px;border-radius:4px}
.golink{display:inline-block;margin-top:8px;font-weight:700;color:var(--accent)}
@media (max-width:760px){
  .road>svg.wire{display:none}
  .road::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--pc);opacity:.55;border-radius:2px}
  .zone-mark{justify-content:flex-start}
  .step{grid-template-columns:1fr;padding-left:34px;gap:10px}
  .mid{order:0;align-items:stretch} .side.l{order:1} .side.r{order:2} .mid,.side.l,.side.r,.detail,.detail.at-r,.detail.at-l,.detail.in-l,.detail.in-r,.detail.flow.at-r,.detail.flow.at-l,.detail.flow.in-r,.detail.flow.in-l{grid-column:1/-1;grid-row:auto;position:relative;left:auto!important;top:auto!important;width:auto!important;box-shadow:none} .detail{order:3}
  .side{gap:10px;align-items:stretch!important}
  .side:not(:empty){margin-left:18px;padding-left:14px;border-left:2px dashed color-mix(in srgb,var(--pc) 55%,var(--line))}
  .node.br{width:100%}
}

/* tickets */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.col h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px}
.pill.done{background:var(--done-soft);color:var(--done)} .pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.open{background:var(--open-soft);color:var(--open)} .pill.dead{background:var(--dead-soft);color:var(--dead)}
ul.tk{list-style:none;margin:0;padding:0}
ul.tk li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;scroll-margin-top:90px}
ul.tk li:first-child{border-top:0}
ul.tk li.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){ul.tk li.flash{animation:none;background:var(--accent-soft)}}
.id{font-family:var(--mono);font-size:12px;font-weight:600;text-decoration:none;padding:1px 6px;border-radius:4px;white-space:nowrap;height:fit-content}
.id.done{color:var(--done);background:var(--done-soft)} .id.wait{color:var(--wait);background:var(--wait-soft)}
.id.open{color:var(--open);background:var(--open-soft)} .id.dead{color:var(--dead);background:var(--dead-soft)}
ul.tk .id{margin-top:2px}
.why{display:block}
.gain{display:block;margin-top:3px;font-size:13.5px}
.gain b{color:var(--open)}
.note2{display:block;font-size:13px;color:var(--muted)}
details.dead{margin-top:14px;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 18px}
details.dead summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.dead ul.tk li{color:var(--muted)}

/* facts */
.facts{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
.facts table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.facts th,.facts td{text-align:left;padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.facts tr:first-child th,.facts tr:first-child td{border-top:0}
.facts th{width:170px;color:var(--muted);font-weight:500}
.facts td code{font-size:12.5px;background:var(--ground);padding:1px 5px;border-radius:4px;word-break:break-all}
.facts details summary{cursor:pointer;color:var(--muted)}
.facts .small{font-size:12.5px;color:var(--muted)}

/* charts */
.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.card h4{margin:0 0 2px;font-size:15px}
.card .sub{margin:0 0 8px;font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg svg{width:22px;height:8px}
.viz{position:relative;touch-action:pan-y}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.viz .gl{stroke:var(--grid);stroke-width:1}
.viz .base{stroke:var(--line);stroke-width:1}
.viz .xh{stroke:var(--faint);stroke-width:1}
.viz .endl{fill:var(--ink);font-weight:700}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translateX(-50%);z-index:2}
.tip[hidden]{display:none}
details.tbl{margin-top:6px;font-size:12.5px;color:var(--muted)}
details.tbl summary{cursor:pointer}
details.tbl table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:2px 10px 2px 0;text-align:right;font-weight:400}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
ul.act{list-style:none;margin:0;padding:0}
ul.act li{display:grid;grid-template-columns:40px 54px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:13.5px;align-items:baseline}
ul.act li:first-child{border-top:0}
ul.act .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
ul.act .k{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;text-align:center;white-space:nowrap}
ul.act .k.commit{background:var(--dead-soft);color:var(--muted)} ul.act .k.done{background:var(--done-soft);color:var(--done)} ul.act .k.pr{background:var(--wait-soft);color:var(--wait)}
ul.act .t{min-width:0;overflow-wrap:anywhere}
ul.act .r{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:6px}
.wk{padding:12px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0;padding-top:2px}
.wk h4{margin:0 0 4px;font-size:14px;font-family:var(--mono);color:var(--muted);font-weight:600}
.wk .sumx{margin:0 0 6px;font-size:14.5px;line-height:1.6;white-space:pre-line}
.wk .sumx.none{color:var(--faint);font-size:13px}
.wk details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.wk ul.act{margin-top:6px}
button.morewk{margin-top:10px;font:inherit;font-size:13.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.morewk:hover{background:var(--ground)}
.facts + h3{margin-top:26px}
footer{margin-top:60px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
footer p{margin:4px 0;max-width:80ch}

const CHARTS = {};
let chartSeq = 0;

function drawChart(el){

  const vals = c.kind === "line" ? c.series.flatMap(s => s.vals) : c.bars.map(b => b.n);
  const top = niceMax(Math.max(...vals, 1)), y = v => Tp + ih * (1 - v / top);
  let g = [0, top/2, top].map(v => `<line class="${v?"gl":"base"}" x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
  let marks = "", n;
  if (c.kind === "line"){
    n = c.days.length; const x = i => L + i * iw / (n - 1);
    for (let i = 0; i < n; i += Math.ceil(n / 4)) if (x(n-1) - x(i) > 44) g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${mdOf(c.days[i])}</text>`;
    g += `<text x="${x(n-1)}" y="${H-6}" text-anchor="end">${mdOf(c.days[n-1])}</text>`;
    const ends = c.series.map(s => ({s, y: y(s.vals[n-1])})).sort((a,b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;  // keep end labels apart
    marks = c.series.map(s => `<polyline fill="none" stroke="var(${s.cls})" stroke-width="2" stroke-linejoin="round" ${s.dashed?'stroke-dasharray="5 4"':""} points="${s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"/>`).join("")
      + ends.map(e => `<text class="endl" x="${L+iw+6}" y="${e.y+4}">${e.s.vals[n-1]} ${esc(e.s.short)}</text>`).join("");
    c.xAt = px => Math.round((px - L) / iw * (n - 1));

  } else {
    n = c.bars.length; const bw = iw / n, x = i => L + i * bw, r = 4, gap = 2;
    marks = c.bars.map((b, i) => {
      const h = ih * b.n / top, x0 = x(i) + gap/2, w = bw - gap, y0 = Tp + ih - h;
      if (!b.n) return "";

    }).join("");
    for (let i = 0; i < n; i += 3) g += `<text x="${x(i)+bw/2}" y="${H-6}" text-anchor="middle">${mdOf(c.bars[i].week)}</text>`;
    const last = c.bars[n-1]; if (last.n) marks += `<text class="endl" x="${x(n-1)+bw/2}" y="${y(last.n)-5}" text-anchor="middle">${last.n}</text>`;
    c.xAt = px => Math.floor((px - L) / bw);

  }
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(c.label)}">${g}${marks}<line class="xh" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" visibility="hidden"/></svg>`;

}
function hoverChart(el, e){

function drawRoad(road){
  const svg = road.querySelector("svg.wire"); if (getComputedStyle(svg).display === "none") return;
  const o = road.getBoundingClientRect(), R = el => { const r = el.getBoundingClientRect(); return {l:r.left-o.left, r:r.right-o.left, t:r.top-o.top, b:r.bottom-o.top, x:(r.left+r.right)/2-o.left, y:(r.top+r.bottom)/2-o.top}; };

function fitMocks(det){  // column-aligned mocks never wrap: shrink the font until the widest line fits (min 11px, then scroll)

  const tbl = (head, rows) => rows.length ? `<h3>${head}</h3><div class="facts"><table>${rows.map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join("")}</table></div>` : "";
  for (const [name, state] of Object.entries(f.sources || {})) cloud.push([esc(name),
    `<span class="st ${state.status === "ok" ? "ok" : "bad"}">${esc(state.status)}</span> ${esc(state.error || "")}<div class="small">${esc(state.fetched_at || "—")}</div>`]);
  const errs = f.errors.length ? [[T.errs, f.errors.map(e => `<div><span class="st bad" style="margin-left:0">!</span> ${esc(e)}</div>`).join("")]] : [];
  return `<p class="hint">${T.facts_hint}</p>${tbl(T.f_local, local)}${tbl(T.f_cloud, cloud)}${tbl(T.errs, errs)}`;
}
function nowLine(p){
  const n = p.now, bits = [];
  if (n.last) bits.push(X(T.now_last, mdOf(n.last)));
  if (hasTk(p) && !ticketComplete(p)) bits.push(esc(ticketLabel(p)));
  else if (hasTk(p)){ bits.push(X(T.now_done7, n.done7)); if (n.wait) bits.push(X(T.now_wait, n.wait)); }
  else if (n.last) bits.push(X(T.now_c14, n.c14));
  if (!bits.length) bits.push(T.now_none);
  return bits.join(T.dot) + T.dot.trim() + (n.err ? ` <span class="st bad">${T.now_err}</span>` : "");
}
function todoText(t){
  if (t.kind === "git") return `${esc(t.where)}：${t.parts.map(([n, k]) => (n != null ? `${n} ` : "") + T[k]).join(T.join)}`;
  return T[t.t];
}
function todoRows(list){
  return list.map(t => `<a class="todo pc" style="--pc0:${esc(t.color)}" href="${esc(String(t.go).startsWith("#") ? t.go : "#")}"><span class="tn">${t.n ?? ""}</span><span class="tt">${todoText(t)}</span><span class="tp">${esc(t.pname || "")}</span><span class="ta" aria-hidden="true">›</span></a>`).join("");
}
const PANELS = [["road", "road"], ["progress", "progress"], ["tickets", "tickets"], ["facts", "facts"]];
const panelsOf = p => PANELS;
function renderProject(p){
  const c = p.counts;
  let h = `<section class="proj pc" id="${esc(p.key)}" style="--pc0:${esc(p.color)}" hidden>
    <a class="back" href="#">${T.back}</a>
    <header class="phead"><h2>${esc(p.name)}</h2>${p.tag ? `<p class="tag">${esc(p.tag)}</p>` : ""}
      <p class="now">${nowLine(p)}</p>
      ${(p.links || []).length ? `<p class="links">${p.links.map(([t, u]) => ext(u, esc(t))).join("")}</p>` : ""}
    </header>
    ${p.todo.length ? `<div class="todos small">${todoRows(p.todo.map(t => ({...t, color:p.color})))}</div>` : ""}
    <nav class="subnav">${panelsOf(p).map(([k]) => `<a href="#${esc(p.key)}/${k}" data-panel="${k}">${T[k]}${k === "tickets" && c.open + c.wait ? `<small>${c.open + c.wait}</small>` : ""}</a>`).join("")}</nav>`;
  h += `<div class="panel" data-panel="road"><p class="hint">${T.road_hint}${hasTk(p) ? T.road_hint_tk : ""}</p>${renderRoad(p)}</div>`;
  h += `<div class="panel" data-panel="progress">${renderTrends(p)}${renderActivity(p)}</div>`;
  h += `<div class="panel" data-panel="tickets">${renderTickets(p)}</div>`;
  h += `<div class="panel" data-panel="facts">${renderFacts(p)}</div>`;
  return h + `</section>`;
}
function spark(weekly){
  const max = Math.max(1, ...weekly.map(w=>w.n)), W = 96, H = 22, bw = W / weekly.length;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${weekly.map((w,i)=>w.n?`<rect x="${(i*bw+1).toFixed(1)}" y="${(H - H*w.n/max).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H*w.n/max).toFixed(1)}" rx="1"/>`:"").join("")}</svg>`;
}
function renderHome(){
  const all = P.flatMap(p => p.todo.map(t => ({...t, pname:p.name, color:p.color})));
  const KIND = [["pr","k_pr","--wait"],["review","k_review","--accent"],["git","k_git","--open"],["data","k_data","--bad"],["err","k_err","--bad"]];
  const tiles = KIND.map(([k, lab, col]) => {
    const rows = all.filter(t => t.kind === k); if (!rows.length) return "";
    const v = rows.every(t => t.n != null) ? rows.reduce((a,t) => a + t.n, 0) : rows.length;
    return `<div class="sumt" style="--c:var(${col})"><b>${v}</b><span>${T[lab]}</span></div>`;
  }).join("");
  let h = `<header class="hero"><p class="eyebrow">${P.length} ${T.projects}</p><h1>${all.length ? T.todo_h : T.nothing}</h1>${tiles ? `<div class="sum">${tiles}</div>` : ""}</header>`;
  if (all.length) h += `<div class="todos">${todoRows(all)}</div>`;
  h += `<h2 class="sec">${T.projects_h}</h2><div class="drawers">${P.map(p => {
    const c = p.counts, commits = (p.weekly || []).reduce((a,w)=>a+w.n,0);
    return `<a class="drawer pc" href="#${esc(p.key)}" style="--pc0:${esc(p.color)}">
      <span class="dn">${esc(p.name)}</span>${p.tag ? `<span class="dt2">${esc(p.tag)}</span>` : ""}
      <span class="dnow">${nowLine(p)}</span>
      <span class="dfoot">${p.weekly ? `${spark(p.weekly)}<span>${X(T.d_weeks, commits)}</span>` : ""}${hasTk(p) && ticketComplete(p) ? `<span>${X(T.d_open, c.open)}${c.wait ? T.join + X(T.d_wait, c.wait) : ""}</span>` : ""}${p.todo.length ? `<span class="dtodo">${X(T.d_todo, p.todo.length)}</span>` : ""}</span></a>`;
  }).join("")}</div>`;
  $("#home").innerHTML = h;
}

/* ---------- routing ---------- */
function typeset(el){ if (!window.MathJax) return; if (MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); else setTimeout(()=>typeset(el), 400); }
let pendingGo = null;
function route(){
  const [key, panel] = decodeURIComponent(location.hash.slice(1)).split("/"), p = P.find(x => x.key === key);
  $("#home").hidden = !!p;
  document.querySelectorAll("section.proj").forEach(s => s.hidden = !p || s.id !== key);
  if (p){
    const sec = document.getElementById(key), ok = panelsOf(p).map(([k]) => k), cur = ok.includes(panel) ? panel : "road";
    sec.querySelectorAll(".panel").forEach(x => x.hidden = x.dataset.panel !== cur);
    sec.querySelectorAll(".subnav a").forEach(a => a.setAttribute("aria-current", a.dataset.panel === cur ? "page" : "false"));
  }
  document.title = p ? `${p.name} · ${D.title}` : D.title;
  document.querySelectorAll("#menuitems a").forEach(a => a.setAttribute("aria-current", a.dataset.k === (p ? key : "home") ? "page" : "false"));
  $("#menulabel").textContent = p ? p.name : T.all;
  toggleMenu(false);
  if (!pendingGo) window.scrollTo(0, 0);
  drawAllCharts();
  if (pendingGo){ const id = pendingGo; pendingGo = null; requestAnimationFrame(() => go(id)); }
}
function toggleMenu(open){
  $("#menu").hidden = !open; $("#menubtn").setAttribute("aria-expanded", open);
  if (open) $("#menuitems a[aria-current='page']")?.focus();
}
function go(id){
  const el = document.getElementById(id); if (!el) return;
  const panel = el.closest(".panel"), sec = el.closest("section.proj");
  if (panel && panel.hidden){ pendingGo = id; location.hash = `${sec.id}/${panel.dataset.panel}`; return; }
  const d = el.closest("details"); if (d) d.open = true;
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function boot(){
  $("#brand").textContent = D.title;
  $("#stamp").textContent = T.updated + D.generated_at.slice(0, 16).replace("T", " ");
  $("#foot").innerHTML = T.foot.map(s => `<p>${s}</p>`).join("");
  renderHome();
  $("#projects").innerHTML = P.map(renderProject).join("");
  $("#menuitems").innerHTML = `<a href="#" data-k="home" class="home"><i></i>${T.all}</a>` + P.map(p => `<a href="#${esc(p.key)}" data-k="${esc(p.key)}"><i style="background:${esc(p.color)}"></i>${esc(p.name)}${p.todo.length ? `<small>${X(T.d_todo, p.todo.length)}</small>` : ""}</a>`).join("");
  $("#menubtn").addEventListener("click", () => toggleMenu($("#menu").hidden));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#menu").hidden){ toggleMenu(false); $("#menubtn").focus(); } });
  document.addEventListener("click", e => {
    if (!$("#menu").hidden && !e.target.closest("#menu,#menubtn")) toggleMenu(false);
    const mw = e.target.closest(".morewk");
    if (mw){ const rest = [...mw.parentNode.querySelectorAll(".wk[hidden]")]; rest.slice(0, 4).forEach(x => x.hidden = false); if (rest.length <= 4) mw.remove(); return; }
    const g = e.target.closest("[data-go]");
    if (g){ go(g.dataset.go); return; }
    const n = e.target.closest(".node");
    if (n){
      const panel = document.getElementById(n.getAttribute("aria-controls")), open = n.getAttribute("aria-expanded") !== "true";
      const set = (x, o) => { x.setAttribute("aria-expanded", o); document.getElementById(x.getAttribute("aria-controls")).hidden = !o; x.querySelector(".x").textContent = o ? T.close_x : T.open_x; };
      if (open) n.closest(".road").querySelectorAll('.node[aria-expanded="true"]').forEach(x => set(x, false));  // one panel at a time
      set(n, open);
      if (open){ fitMocks(panel); placeDetail(panel, true); n.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
      if (open && !panel.dataset.typeset){ panel.dataset.typeset = 1; typeset(panel); }
    }
  });
  const dro = new ResizeObserver(es => es.forEach(e => placeDetail(e.target)));  // formulas/images grow a panel after it opens
  document.querySelectorAll(".detail").forEach(d => dro.observe(d));
  let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(drawAllCharts, 120); }).observe($("#projects"));
  document.addEventListener("pointermove", e => { const v = e.target.closest?.(".viz"); document.querySelectorAll(".viz .tip:not([hidden])").forEach(t => { if (t.parentNode !== v) leaveChart(t.parentNode); }); if (v && v.querySelector("svg")) hoverChart(v, e); });
  document.addEventListener("pointerleave", e => { if (e.target.classList?.contains("viz")) leaveChart(e.target); }, true);
  window.addEventListener("hashchange", route);
  route();
}
boot();
</script>
</body>
